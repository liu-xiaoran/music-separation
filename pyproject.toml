[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-sep"
version = "0.1.0"
description = "AI 音乐分离、歌词识别与可视化 CLI 工具"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "typer>=0.12,<1.0",
    "demucs>=4.0",
    "faster-whisper>=1.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "torch>=2.0",
    "pydub>=0.25",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
music-sep = "music_sep.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/music_sep"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 需要模型下载或 GPU 的测试",
]
